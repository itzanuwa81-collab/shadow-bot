name: SHADOW WhatsApp Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    env:
      BOT_NUMBER: ${{ secrets.BOT_NUMBER }}
      CHAMA_API_KEY: ${{ secrets.CHAMA_API_KEY }}
      SUPUN_API_KEY: ${{ secrets.SUPUN_API_KEY }}

    steps:
      - name: Checkout SHADOW
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Start SHADOW
        run: node index.js
